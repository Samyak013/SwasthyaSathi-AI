[build]
publish = "dist/public"
command = "npm run build"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/server:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[edge]]
path = "/api/*"
function = "server"

[env.production]
[env.production.context.production]
environment = { NODE_ENV = "production" }
