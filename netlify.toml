[build]
command = "npm run build"
publish = "dist/public"

# Use Netlify function for better API proxy with timeout handling
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api:splat"
status = 200
force = true

# Fallback: Direct proxy with timeout (25 seconds for Render cold start)
[[redirects]]
from = "/api-direct/*"
to = "https://swasthyasathi-ai.onrender.com/:splat"
status = 200
force = true

# SPA Routing: Send all requests to index.html for React Router to handle
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[env.production]
environment = { NODE_ENV = "production" }


