[build]
command = "npm run build"
publish = "dist/public"

# OTP endpoint - route to dedicated Netlify function (independent of Render)
[[redirects]]
from = "/api/auth/send-otp"
to = "/.netlify/functions/send-otp"
status = 200
force = true

# Use Netlify function for better API proxy with timeout handling
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api:splat"
status = 200
force = true

# SPA Routing: Send all requests to index.html for React Router to handle
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[env.production]
environment = { NODE_ENV = "production" }


